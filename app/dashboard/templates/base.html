<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Honeypot Dashboard{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f3f4f8; color: #2d2f36; }
        a { color: #5a67d8; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 18px 40px;
                  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .header h1 { font-size: 24px; font-weight: 600; }
        .header p { font-size: 13px; opacity: 0.9; margin-top: 3px; }
        .nav a { color: white; margin-left: 18px; font-weight: 500; opacity: 0.9; }
        .nav a.active, .nav a:hover { opacity: 1; text-decoration: underline; }
        .container { max-width: 1400px; margin: 0 auto; padding: 28px 20px 60px; }
        .grid { display: grid; gap: 18px; }
        .stats-grid { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 24px; }
        .two-col { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); margin-bottom: 18px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); padding: 20px; }
        .stat h3 { font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
        .stat .value { font-size: 30px; font-weight: 700; color: #4c51bf; margin-top: 6px; }
        .card h2 { font-size: 16px; margin-bottom: 14px; color: #333; }
        .muted { color: #888; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 10px; background: #f7f7fb; color: #555; font-weight: 600; border-bottom: 2px solid #e4e4ee; }
        th a { color: #555; }
        td { padding: 9px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
        tr:hover td { background: #fafaff; }
        .mono { font-family: Consolas, 'Courier New', monospace; font-size: 13px; }
        .bar-row { display: grid; grid-template-columns: 170px 1fr 48px; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
        .bar-row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar { background: #edf0ff; border-radius: 4px; height: 16px; overflow: hidden; }
        .bar span { display: block; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 4px; }
        .bar.red span { background: linear-gradient(90deg, #f56565, #c53030); }
        .bar.green span { background: linear-gradient(90deg, #48bb78, #2f855a); }
        .bar-row .num { text-align: right; font-weight: 600; }
        .timeline { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding-top: 10px; }
        .timeline div { flex: 1; background: linear-gradient(180deg, #667eea, #764ba2); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
        .timeline div:hover { opacity: .75; }
        .timeline-labels { display: flex; justify-content: space-between; font-size: 11px; color: #999; margin-top: 6px; }
        .badge { display: inline-block; padding: 2px 9px; border-radius: 11px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .badge-http { background: #e3f2fd; color: #1565c0; }
        .badge-ssh { background: #f3e5f5; color: #7b1fa2; }
        .badge-active { background: #e8f5e9; color: #2e7d32; }
        .badge-ended { background: #eceff1; color: #546e7a; }
        .badge-ok { background: #fff3e0; color: #e65100; }
        .badge-fail { background: #eceff1; color: #546e7a; }
        .risk-high { background: #ffebee; color: #c62828; }
        .risk-med { background: #fff8e1; color: #b26a00; }
        .risk-low { background: #e8f5e9; color: #2e7d32; }
        .risk-none { background: #eceff1; color: #607d8b; }
        .terminal { background: #1e1e2e; color: #d4d4dc; border-radius: 8px; padding: 16px; font-family: Consolas, 'Courier New', monospace;
                    font-size: 13px; line-height: 1.5; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
        .terminal .prompt { color: #50fa7b; }
        .terminal .cmd { color: #fff; font-weight: 600; }
        .terminal .tag { float: right; font-size: 11px; padding: 1px 7px; border-radius: 9px; margin-left: 8px; }
        .terminal .out { color: #a6accd; display: block; margin-bottom: 8px; }
        .filters a, .pager a, .pager span { display: inline-block; padding: 6px 12px; margin-right: 6px; border-radius: 6px; background: white;
                                             box-shadow: 0 1px 3px rgba(0,0,0,.08); font-size: 13px; }
        .filters a.on, .pager span.on { background: #667eea; color: white; }
        .pager { margin-top: 18px; }
        .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
        .kv div span { display: block; font-size: 12px; color: #888; text-transform: uppercase; }
        .kv div strong { font-size: 14px; word-break: break-all; }
        details pre { background: #f7f7fb; padding: 10px; border-radius: 6px; font-size: 12px; overflow-x: auto; margin-top: 6px; }
        .downloads a { margin-right: 14px; font-size: 13px; }
        .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #48bb78; margin-right: 6px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🍯 Network Honeypot Dashboard</h1>
            <p>Threat intelligence from the SSH and HTTP decoys</p>
        </div>
        <div class="nav">
            <a href="/" class="{{ 'active' if request.path == '/' }}">Overview</a>
            <a href="/sessions" class="{{ 'active' if request.path.startswith('/session') }}">Sessions</a>
        </div>
    </div>
    <div class="container">
        {% block content %}
        {% if not_found %}
        <div class="card"><h2>Not found</h2><p class="muted">That page or session does not exist. <a href="/sessions">Back to sessions</a></p></div>
        {% endif %}
        {% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
